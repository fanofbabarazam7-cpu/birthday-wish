<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>1 Million Subscribers 🚀</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff0000, #8b0000);
            color: white;
            overflow: hidden;
        }

        .box {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 45px 30px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .youtube {
            font-size: 75px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 30px;
            color: #ffe600;
            margin-bottom: 20px;
        }

        p {
            font-size: 19px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        button {
            border: none;
            padding: 16px 30px;
            border-radius: 50px;
            background: white;
            color: #e00000;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(255,255,255,0.7);
        }

        .input-area {
            display: none;
            margin-top: 25px;
        }

        input {
            width: 80%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            outline: none;
            font-size: 17px;
            text-align: center;
            margin-bottom: 15px;
        }

        .success {
            display: none;
            margin-top: 20px;
            font-size: 20px;
            color: #00ff88;
        }

        .confetti {
            position: absolute;
            top: -30px;
            font-size: 25px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="youtube">▶️</div>

        <h1>CONGRATULATIONS! 🎉</h1>

        <h2>1,000,000 SUBSCRIBERS!</h2>

        <p>
            Abdullah, your YouTube channel has officially
            reached <b>ONE MILLION SUBSCRIBERS!</b> 🚀
            <br><br>
            You've unlocked your special creator reward!
        </p>

        <button onclick="showInput()">
            🏆 Claim Your Reward
        </button>

        <div class="input-area" id="inputArea">

            <p>Enter your YouTube handle:</p>

            <input
                type="text"
                id="handle"
                placeholder="@Abdullah"
            >

            <br>

            <button onclick="claimReward()">
                🎁 Continue
            </button>

        </div>

        <div class="success" id="success">
            Verifying your channel... 🔍
        </div>

    </div>

    <script>

        function showInput() {
            document.getElementById("inputArea").style.display = "block";
        }

        function claimReward() {

            const handle = document.getElementById("handle").value.trim();

            if (handle === "") {
                alert("Please enter your YouTube handle first! 😄");
                return;
            }

            document.getElementById("inputArea").style.display = "none";

            document.getElementById("success").style.display = "block";

            setTimeout(function() {

                window.location.href =
                    "https://youtu.be/Aq5WXmQQooo";

            }, 1800);
        }

        // Celebration confetti
        function createConfetti() {

            const confetti = document.createElement("div");

            const emojis = ["🎉", "🎊", "⭐", "🏆", "🔥", "✨"];

            confetti.className = "confetti";

            confetti.innerHTML =
                emojis[Math.floor(Math.random() * emojis.length)];

            confetti.style.left =
                Math.random() * 100 + "vw";

            confetti.style.animationDuration =
                (2 + Math.random() * 3) + "s";

            document.body.appendChild(confetti);

            setTimeout(function() {
                confetti.remove();
            }, 5000);
        }

        setInterval(createConfetti, 200);

    </script>

</body>
</html>
